<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User profile card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <h1>User Profile Card</h1>

    <div class="card">
        <table>
            <tr>
                <td>
                    <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="Profile">
                </td>
            </tr>
            <tr>
                <td class="login">Snoopy 42</td>
            </tr>
            <tr>
                <td class="desc">Am I cute enough^-^</td>
            </tr>
            <tr>
                <td class="socials">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="Github">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
                </td>
            </tr>
            <tr>
                <td class="contact-td">
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
