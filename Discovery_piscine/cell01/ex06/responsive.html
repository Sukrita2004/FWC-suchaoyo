<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="width: 50%; background-color: rgb(238, 166, 144); padding: 20px; border: 1px solid black;">
                Golden Retriever
            </td>
            <td style="width: 50%; background-color: rgb(165, 230, 232); padding: 20px; border: 1px solid black;">
                Samoyed
            </td>
        </tr>
    </table>

</body>
</html>
